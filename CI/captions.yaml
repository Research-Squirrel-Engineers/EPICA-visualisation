ci_findspots_campania:
  caption: "The 40 findspots within 2 degrees of the Phlegraean Fields, 2 of them archaeological sites, at a scale the overview map cannot resolve. Colour is the certainty of the findspot, the star is the source of the eruption, the dashed rings are the same 500 km great-circle intervals. The coastline is the modern one; at the time of the eruption sea level stood some 80 m lower and the shelf areas, the northern Adriatic above all, were dry land."
