ci_findspots_certainty:
  caption: "74 documented findspots of Campanian Ignimbrite tephra, 12 of them archaeological sites (3 of those added by geo-lod's curated annotations, the rest stated in the source table). Distances from the Phlegraean Fields run to 2752 km. Left: the findspot map, coloured by certainty, triangles are archaeological sites. Top right: how many findspots carry each certainty level (high 14, representative 2, medium 47, low 6, dubious 5). Bottom right: the same levels against great-circle distance from the source, which is where a distant findspot that is only weakly attested becomes visible as such."
