plate_pipeline_outputs:
  caption: "δ¹⁸O of the six SISAL sites of this repository, one panel per site: Spannagel cave, Sanbao cave, Botuverá cave, Antro del Corchia, Piani Eterni karst system, Buraca Gloriosa. Each panel shows the measured series in grey behind a rolling median over 11 points, one line per speleothem, coloured as in the site figures. The panels do not share an age axis: each is scaled to its own record, and the age range is stated on the axis. Marine Isotope Stage bands follow Railsback et al. (2015); an outlined band marks a stage without a measurement in that site."
