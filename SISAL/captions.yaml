140_sanbao_d18o_age_savgol11p2:
  caption: "δ¹⁸O of Sanbao cave from the SISAL v3 database, 6085 measurements on 18 speleothems (SB-58, SB61, SB11, SB42, SB41, SB25-2, SB23, TF, SB34, SB22, SB25-1, SB3, SB-49, SB-44, SB-43, SB-10_2009, SB-27, SB-26_2009), ages from 0.0 to 464.8 ka BP on the linear interpolation age model. Each speleothem is drawn as its own line; together they are not one record. A Savitzky-Golay filter over 11 points at polynomial order 2 is drawn over the measured series. Marine Isotope Stage bands follow Railsback et al. (2015); an outlined band marks a stage without a measurement in this site."
  generated: "δ¹⁸O of Sanbao cave from the SISAL v3 database, 6085 measurements on 18 speleothems (SB-58, SB61, SB11, SB42, SB41, SB25-2, SB23, TF, SB34, SB22, SB25-1, SB3, SB-49, SB-44, SB-43, SB-10_2009, SB-27, SB-26_2009), ages from 0.0 to 464.8 ka BP on the linear interpolation age model. Each speleothem is drawn as its own line; together they are not one record. A Savitzky-Golay filter over 11 points at polynomial order 2 is drawn over the measured series. Marine Isotope Stage bands follow Railsback et al. (2015); an outlined band marks a stage without a measurement in this site."
