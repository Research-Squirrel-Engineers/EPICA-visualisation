10_jaragua_d13c_age_savgol11p2:
  caption: "δ¹³C of Jaraguá cave from the SISAL v3 database, 4358 measurements on 6 speleothems (JAR13, JAR14, JAR7, JAR2, JAR1, JAR4), ages from -0.1 to 27.9 ka BP on the linear interpolation age model. Each speleothem is drawn as its own line; together they are not one record. A Savitzky-Golay filter over 11 points at polynomial order 2 is drawn over the measured series. Marine Isotope Stage bands follow Railsback et al. (2015); an outlined band marks a stage without a measurement in this site."
