plate_coverage:
  caption: "Age coverage of the 39 speleothems of the six SISAL sites in this repository, one bar per speleothem, grouped by site and coloured as in the site figures. A bar is interrupted where the record is: 4 of them carry a break in sampling. Overlapping bars within a site are why the samples of a site are not drawn as one curve - at Sanbao six speleothems cover the interval between 0.4 and 13.6 ka. Marine Isotope Stage bands follow Railsback et al. (2015)."
