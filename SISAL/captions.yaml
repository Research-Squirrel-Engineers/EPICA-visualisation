plate_cluster_east_asian_monsoon:
  caption: "δ¹⁸O of the 4 SISAL sites of the East Asian monsoon cluster, one panel per site: Sanbao cave, Xiaobailong cave, Dongge cave, Heshang cave. Each panel shows the measured series in grey behind a rolling median over 11 points, one line per speleothem, coloured as in the site figures; 34 speleothems in all. The panels share one age axis over the whole cluster, 0.0 to 464.8 ka BP, so that features can be compared between sites; the value axis is scaled per panel. Marine Isotope Stage bands follow Railsback et al. (2015); an outlined band marks a stage without a measurement in that site."
