plate_coverage_east_asian_monsoon:
  caption: "Age coverage of the 34 speleothems of the East Asian monsoon cluster, one bar per speleothem, grouped by site and coloured as in the site figures. The sites are Sanbao cave, Xiaobailong cave, Dongge cave, Heshang cave, ordered by how far back their record reaches. A bar is interrupted where the record is: 2 of them carry a break in sampling. 2 stretches shorter than 1.9 ka are drawn as a dot rather than a bar, being narrower than the axis can resolve. Overlapping bars within a site are why the samples of a site are not drawn as one curve. Marine Isotope Stage bands follow Railsback et al. (2015)."
