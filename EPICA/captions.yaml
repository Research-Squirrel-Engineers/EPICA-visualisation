epica_dome_c_map:
  caption: "EPICA Dome C on the Antarctic ice sheet, 75.10°S 123.35°E at 3233 m, in south polar stereographic projection; parallels at 60, 70 and 80°S. The inset shows the two PANGAEA events of this core at their own scale: EDC99, which carries the methane, deuterium and dust records, and DomeC, which carries the two 2023 gas datasets. Their headers place them 1.3 km apart although the material is from the same core - a difference between metadata records, not a second borehole."
  generated: "EPICA Dome C on the Antarctic ice sheet, 75.10°S 123.35°E at 3233 m, in south polar stereographic projection; parallels at 60, 70 and 80°S. The inset shows the two PANGAEA events of this core at their own scale: EDC99, which carries the methane, deuterium and dust records, and DomeC, which carries the two 2023 gas datasets. Their headers place them 1.3 km apart although the material is from the same core - a difference between metadata records, not a second borehole."
  license: "CC BY 4.0, Florian Thiery"
  sources:
