# Export definition for `py/export_sites.py`.
#
# Everything the export does is declared here: which sites it covers, the SQL
# that produces each output file, and the referential checks run against the
# result. The script itself holds no SQL, so a change to what is exported is a
# change to this file and shows up as such in a diff.
#
# Two shapes are written, from the same selection:
#
#   tables/<table>.csv   one file per release table, restricted to the sites
#                        below, keys intact. This is the structure-preserving
#                        cut: site -> entity -> sample -> chronology can be
#                        rebuilt from it, which is what the RDF generator in
#                        geo-lod needs.
#   <stem>.csv           one flat file per site, the joined figure input used
#                        by wdttest-sisal.
#
# Placeholders: {sites} expands to the site list, {site_id} to a single site.
# Both are interpolated through psycopg2's `sql.Literal`, never by string
# formatting.
#
# Every statement carries an ORDER BY. Without one, PostgreSQL is free to
# return rows in any order and a second run would rewrite the file with the
# same content in a different sequence -- a diff that means nothing and hides
# the ones that do.

sites: [58, 140, 144, 145, 202, 275]

# site_id -> output stem for the flat per-site files. The three names already
# in data/derived/ are kept exactly as they are: wdttest-sisal reads them, and
# a rename would look like new data.
per_site_stems:
  58: spannagel_all
  140: sanbao
  144: botuvera
  145: corchia
  202: piani_eterni_karst_system
  275: buraca_gloriosa

# Known-good row counts for the flat per-site files, from the pristine SISAL v3
# release. A mismatch means the database is not what we think it is.
#
# 58, 202 and 275 were verified in S3b. The other three were recorded from the
# first full run rather than guessed: Sanbao 6085 is the number of samples
# carrying both d18O and a lin_interp_age, not the 9535 d18O measurements of its
# non-superseded entities and not its 10063 samples.
expected_rows:
  58: 7869
  140: 6085
  144: 920
  145: 1345
  202: 781
  275: 1178

# --------------------------------------------------------------------------
# Per-table cut
# --------------------------------------------------------------------------
# Table order is the load order of build_database.py: parents before children.
# Reading the files back in this order therefore never hits a dangling key.
tables:

  site: |
    SELECT t.*
      FROM site t
     WHERE t.site_id IN ({sites})
     ORDER BY t.site_id

  reference: |
    SELECT DISTINCT t.*
      FROM reference t
      JOIN entity_link_reference elr ON elr.ref_id = t.ref_id
      JOIN entity e                  ON e.entity_id = elr.entity_id
     WHERE e.site_id IN ({sites})
     ORDER BY t.ref_id

  entity: |
    SELECT t.*
      FROM entity t
     WHERE t.site_id IN ({sites})
     ORDER BY t.entity_id

  sample: |
    SELECT t.*
      FROM sample t
      JOIN entity e ON e.entity_id = t.entity_id
     WHERE e.site_id IN ({sites})
     ORDER BY t.sample_id

  notes: |
    SELECT t.*
      FROM notes t
     WHERE t.site_id IN ({sites})
     ORDER BY t.site_id

  dating: |
    SELECT t.*
      FROM dating t
      JOIN entity e ON e.entity_id = t.entity_id
     WHERE e.site_id IN ({sites})
     ORDER BY t.dating_id

  dating_lamina: |
    SELECT t.*
      FROM dating_lamina t
      JOIN entity e ON e.entity_id = t.entity_id
     WHERE e.site_id IN ({sites})
     ORDER BY t.dating_lamina_id

  # Both ends must be inside the cut. A composite entity built from an entity
  # of another site would otherwise leave a key pointing at nothing. How many
  # rows that costs is reported by the `composite_link_split` diagnostic below;
  # as long as it is zero, this filter loses nothing.
  composite_link_entity: |
    SELECT t.*
      FROM composite_link_entity t
      JOIN entity ec ON ec.entity_id = t.composite_entity_id
      JOIN entity es ON es.entity_id = t.single_entity_id
     WHERE ec.site_id IN ({sites})
       AND es.site_id IN ({sites})
     ORDER BY t.composite_entity_id, t.single_entity_id

  entity_link_reference: |
    SELECT t.*
      FROM entity_link_reference t
      JOIN entity e ON e.entity_id = t.entity_id
     WHERE e.site_id IN ({sites})
     ORDER BY t.entity_id, t.ref_id

  sisal_chronology: |
    SELECT t.*
      FROM sisal_chronology t
      JOIN sample sa ON sa.sample_id = t.sample_id
      JOIN entity e  ON e.entity_id = sa.entity_id
     WHERE e.site_id IN ({sites})
     ORDER BY t.sample_id

  original_chronology: |
    SELECT t.*
      FROM original_chronology t
      JOIN sample sa ON sa.sample_id = t.sample_id
      JOIN entity e  ON e.entity_id = sa.entity_id
     WHERE e.site_id IN ({sites})
     ORDER BY t.sample_id

  gap: |
    SELECT t.*
      FROM gap t
      JOIN sample sa ON sa.sample_id = t.sample_id
      JOIN entity e  ON e.entity_id = sa.entity_id
     WHERE e.site_id IN ({sites})
     ORDER BY t.sample_id

  hiatus: |
    SELECT t.*
      FROM hiatus t
      JOIN sample sa ON sa.sample_id = t.sample_id
      JOIN entity e  ON e.entity_id = sa.entity_id
     WHERE e.site_id IN ({sites})
     ORDER BY t.sample_id

  d18o: |
    SELECT t.*
      FROM d18o t
      JOIN sample sa ON sa.sample_id = t.sample_id
      JOIN entity e  ON e.entity_id = sa.entity_id
     WHERE e.site_id IN ({sites})
     ORDER BY t.sample_id

  d13c: |
    SELECT t.*
      FROM d13c t
      JOIN sample sa ON sa.sample_id = t.sample_id
      JOIN entity e  ON e.entity_id = sa.entity_id
     WHERE e.site_id IN ({sites})
     ORDER BY t.sample_id

  ba_ca: |
    SELECT t.*
      FROM ba_ca t
      JOIN sample sa ON sa.sample_id = t.sample_id
      JOIN entity e  ON e.entity_id = sa.entity_id
     WHERE e.site_id IN ({sites})
     ORDER BY t.sample_id

  mg_ca: |
    SELECT t.*
      FROM mg_ca t
      JOIN sample sa ON sa.sample_id = t.sample_id
      JOIN entity e  ON e.entity_id = sa.entity_id
     WHERE e.site_id IN ({sites})
     ORDER BY t.sample_id

  sr_ca: |
    SELECT t.*
      FROM sr_ca t
      JOIN sample sa ON sa.sample_id = t.sample_id
      JOIN entity e  ON e.entity_id = sa.entity_id
     WHERE e.site_id IN ({sites})
     ORDER BY t.sample_id

  p_ca: |
    SELECT t.*
      FROM p_ca t
      JOIN sample sa ON sa.sample_id = t.sample_id
      JOIN entity e  ON e.entity_id = sa.entity_id
     WHERE e.site_id IN ({sites})
     ORDER BY t.sample_id

  u_ca: |
    SELECT t.*
      FROM u_ca t
      JOIN sample sa ON sa.sample_id = t.sample_id
      JOIN entity e  ON e.entity_id = sa.entity_id
     WHERE e.site_id IN ({sites})
     ORDER BY t.sample_id

  sr_isotopes: |
    SELECT t.*
      FROM sr_isotopes t
      JOIN sample sa ON sa.sample_id = t.sample_id
      JOIN entity e  ON e.entity_id = sa.entity_id
     WHERE e.site_id IN ({sites})
     ORDER BY t.sample_id

# --------------------------------------------------------------------------
# Flat per-site cut
# --------------------------------------------------------------------------
# One statement, one site. The LEFT JOIN on d13c keeps samples carrying only
# d18O; an inner join would silently drop them (Spannagel has 2302 d18O but
# only 947 d13c values inside the figure window).
#
# The age window is deliberately NOT applied here. Every dated sample of a site
# is exported, and the plotting script owns the window. Keeping the window in
# exactly one place is what stops the SQL filter and the plot filter from
# drifting apart -- which is how Piani Eterni came to be plotted over
# 128-220 kyr on a 115-250 kyr axis, silently losing the samples in between.
per_site: |
  SELECT s.site_id,
         s.site_name,
         e.entity_id,
         e.entity_name,
         sa.sample_id,
         ch.lin_interp_age            AS age_bp,
         ch.lin_interp_age_uncert_pos AS age_uncert_pos,
         ch.lin_interp_age_uncert_neg AS age_uncert_neg,
         d18o.d18o_measurement AS d18o,
         d13c.d13c_measurement AS d13c
    FROM d18o
    JOIN sample sa           ON sa.sample_id = d18o.sample_id
    JOIN entity e            ON e.entity_id  = sa.entity_id
    JOIN site s              ON s.site_id    = e.site_id
    JOIN sisal_chronology ch ON ch.sample_id = sa.sample_id
    LEFT JOIN d13c           ON d13c.sample_id = sa.sample_id
   WHERE s.site_id = {site_id}
     AND ch.lin_interp_age IS NOT NULL
   ORDER BY age_bp ASC, sa.sample_id ASC

# --------------------------------------------------------------------------
# Checks
# --------------------------------------------------------------------------
# Referential closure of the written cut, one entry per foreign key in
# postgres/constraints.sql. These are checked against the CSV files, not
# against the database: the database is known to be sound after S3b, the open
# question is whether the *cut* is. A key pointing outside it would surface in
# geo-lod as a triple about something that is not there.
foreign_keys:
  - {child: entity,                column: site_id,             parent: site,      key: site_id}
  - {child: notes,                 column: site_id,             parent: site,      key: site_id}
  - {child: sample,                column: entity_id,           parent: entity,    key: entity_id}
  - {child: dating,                column: entity_id,           parent: entity,    key: entity_id}
  - {child: dating_lamina,         column: entity_id,           parent: entity,    key: entity_id}
  - {child: composite_link_entity, column: composite_entity_id, parent: entity,    key: entity_id}
  - {child: composite_link_entity, column: single_entity_id,    parent: entity,    key: entity_id}
  - {child: entity_link_reference, column: entity_id,           parent: entity,    key: entity_id}
  - {child: entity_link_reference, column: ref_id,              parent: reference, key: ref_id}
  - {child: sisal_chronology,      column: sample_id,           parent: sample,    key: sample_id}
  - {child: original_chronology,   column: sample_id,           parent: sample,    key: sample_id}
  - {child: gap,                   column: sample_id,           parent: sample,    key: sample_id}
  - {child: hiatus,                column: sample_id,           parent: sample,    key: sample_id}
  - {child: d18o,                  column: sample_id,           parent: sample,    key: sample_id}
  - {child: d13c,                  column: sample_id,           parent: sample,    key: sample_id}
  - {child: ba_ca,                 column: sample_id,           parent: sample,    key: sample_id}
  - {child: mg_ca,                 column: sample_id,           parent: sample,    key: sample_id}
  - {child: sr_ca,                 column: sample_id,           parent: sample,    key: sample_id}
  - {child: p_ca,                  column: sample_id,           parent: sample,    key: sample_id}
  - {child: u_ca,                  column: sample_id,           parent: sample,    key: sample_id}
  - {child: sr_isotopes,           column: sample_id,           parent: sample,    key: sample_id}

# Single-number questions asked of the database, reported next to the export.
# They say something the row counts cannot: whether the cut had to leave
# something behind.
diagnostics:

  # Composite entities linking across the site boundary. Every such row is
  # dropped by the both-ends filter above, so a non-zero count is a real loss
  # and needs a decision, not a wider filter.
  composite_link_split: |
    SELECT count(*)
      FROM composite_link_entity t
      JOIN entity ec ON ec.entity_id = t.composite_entity_id
      JOIN entity es ON es.entity_id = t.single_entity_id
     WHERE (ec.site_id IN ({sites})) <> (es.site_id IN ({sites}))

  # Samples of the selected sites with no entry in sisal_chronology. They are
  # exported (sample.csv holds them) but carry no age, so the RDF generator has
  # to decide what to do with them rather than discover them later.
  samples_without_chronology: |
    SELECT count(*)
      FROM sample sa
      JOIN entity e ON e.entity_id = sa.entity_id
      LEFT JOIN sisal_chronology ch ON ch.sample_id = sa.sample_id
     WHERE e.site_id IN ({sites})
       AND ch.sample_id IS NULL

  # Modelled ages younger than 1950, the extrapolation past the topmost dating
  # point described in the S3b guard. Counted here for the selected sites only,
  # because these are the ones that reach the graph.
  chronology_ages_after_1950: |
    SELECT count(*)
      FROM sisal_chronology ch
      JOIN sample sa ON sa.sample_id = ch.sample_id
      JOIN entity e  ON e.entity_id = sa.entity_id
     WHERE e.site_id IN ({sites})
       AND ch.lin_interp_age < 0
